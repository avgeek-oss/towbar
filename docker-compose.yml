name: towbar

x-api-image: &api-image
  image: ${TOWBAR_API_IMAGE:-towbar/api:${TOWBAR_IMAGE_TAG:-local}}

x-temporal-tools-image: &temporal-tools-image
  image: temporalio/admin-tools:1.31.1@sha256:0fa94393f6254dea05df1cdacb7a8ee95f6fb51a2ffbde0c6847a73037f788c7

x-backend-environment: &backend-environment
  NODE_ENV: production
  SOURCE_COMMIT: ${SOURCE_COMMIT:-development}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TOWBAR_INTERNAL_HMAC_SECRET: ${TOWBAR_INTERNAL_HMAC_SECRET:?set TOWBAR_INTERNAL_HMAC_SECRET}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: towbar
      POSTGRES_USER: towbar
      POSTGRES_PASSWORD: ${TOWBAR_POSTGRES_PASSWORD:?set TOWBAR_POSTGRES_PASSWORD}
      TOWBAR_DATABASE_RUNTIME_PASSWORD: ${TOWBAR_DATABASE_RUNTIME_PASSWORD:?set TOWBAR_DATABASE_RUNTIME_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U towbar -d towbar"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [platform]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro

  temporal-schema:
    <<: *temporal-tools-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/etc/towbar/temporal-schema.sh"]
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_USER: towbar
      SQL_PASSWORD: ${TOWBAR_POSTGRES_PASSWORD:?set TOWBAR_POSTGRES_PASSWORD}
    volumes:
      - ./infra/temporal/schema.sh:/etc/towbar/temporal-schema.sh:ro
    networks: [platform]

  temporal:
    image: temporalio/server:1.31.1@sha256:5728db90c9883f5b2a7b8ea0bcdfb84edbc9f6c14479cd3354957aa77d4b8bac
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: towbar
      POSTGRES_PWD: ${TOWBAR_POSTGRES_PASSWORD:?set TOWBAR_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/towbar/temporal-dynamic.yaml
      # Trusted control-plane network only; neither API port is published.
      TEMPORAL_ALLOW_NO_AUTH: "true"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:7243/api/v1/namespaces",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - ./infra/temporal/dynamic.yaml:/etc/towbar/temporal-dynamic.yaml:ro
    networks: [platform]

  temporal-namespace:
    <<: *temporal-tools-image
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    command: ["sh", "/etc/towbar/temporal-namespace.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./infra/temporal/namespace.sh:/etc/towbar/temporal-namespace.sh:ro
    networks: [platform]

  temporal-ui:
    image: temporalio/ui:2.34.0@sha256:cb17ea423d76a8a19a269d0bcd81fc12eee1f6365acd2a56b590dafb35696a95
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TOWBAR_APP_BASE_URL:-http://localhost:4021}
    networks: [platform]
    ports:
      - "127.0.0.1:${TOWBAR_TEMPORAL_UI_PORT:-8233}:8080"

  migrate:
    <<: *api-image
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/cli/migrate.js"]
    environment:
      DATABASE_TOWBAR_MIGRATOR_URL: postgres://towbar:${TOWBAR_POSTGRES_PASSWORD:?set TOWBAR_POSTGRES_PASSWORD}@postgres:5432/towbar
      NODE_ENV: production
    networks: [platform]
    restart: "no"

  api:
    <<: *api-image
    build:
      context: .
      dockerfile: apps/towbar-api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      DATABASE_TOWBAR_URL: postgres://towbar_app:${TOWBAR_DATABASE_RUNTIME_PASSWORD:?set TOWBAR_DATABASE_RUNTIME_PASSWORD}@postgres:5432/towbar
      TOWBAR_APP_BASE_URL: ${TOWBAR_APP_BASE_URL:-http://localhost:4021}
      TOWBAR_API_BASE_URL: ${TOWBAR_API_BASE_URL:-http://localhost:4020}
      TOWBAR_CREDENTIALS_KEY: ${TOWBAR_CREDENTIALS_KEY:?set TOWBAR_CREDENTIALS_KEY}
      TOWBAR_PASSWORD_BREACH_CHECK: ${TOWBAR_PASSWORD_BREACH_CHECK:-true}
      TOWBAR_PASSWORD_VERIFY_CONCURRENCY: ${TOWBAR_PASSWORD_VERIFY_CONCURRENCY:-2}
      TOWBAR_PASSWORD_VERIFY_QUEUE_LIMIT: ${TOWBAR_PASSWORD_VERIFY_QUEUE_LIMIT:-16}
      TOWBAR_LOGS_CONFIG_JSON: ${TOWBAR_LOGS_CONFIG_JSON:-}
      TOWBAR_API_RATE_LIMIT_MAX: ${TOWBAR_API_RATE_LIMIT_MAX:-60}
      TOWBAR_API_RATE_LIMIT_WINDOW_SECONDS: ${TOWBAR_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      TOWBAR_VULNERABILITY_SCANNING_ENABLED: ${TOWBAR_VULNERABILITY_SCANNING_ENABLED:-false}
      TOWBAR_VULNERABILITY_SCAN_MAX_AGE_HOURS: ${TOWBAR_VULNERABILITY_SCAN_MAX_AGE_HOURS:-168}
      TOWBAR_GITHUB_ENABLED: ${TOWBAR_GITHUB_ENABLED:-false}
      TOWBAR_GITHUB_APP_ID: ${TOWBAR_GITHUB_APP_ID:-}
      TOWBAR_GITHUB_APP_SLUG: ${TOWBAR_GITHUB_APP_SLUG:-}
      TOWBAR_GITHUB_PRIVATE_KEY_BASE64: ${TOWBAR_GITHUB_PRIVATE_KEY_BASE64:-}
      TOWBAR_GITHUB_WEBHOOK_SECRET: ${TOWBAR_GITHUB_WEBHOOK_SECRET:-}
      TOWBAR_GITHUB_API_URL: ${TOWBAR_GITHUB_API_URL:-}
      TOWBAR_REGISTRY_ENABLED: ${TOWBAR_REGISTRY_ENABLED:-false}
      TOWBAR_REGISTRY_HOST: ${TOWBAR_REGISTRY_HOST:-}
      TOWBAR_REGISTRY_USERNAME: ${TOWBAR_REGISTRY_USERNAME:-}
      TOWBAR_REGISTRY_PASSWORD: ${TOWBAR_REGISTRY_PASSWORD:-}
      TOWBAR_REGISTRY_ALLOW_PRIVATE_NETWORK: ${TOWBAR_REGISTRY_ALLOW_PRIVATE_NETWORK:-false}
      TOWBAR_AWS_ENABLED: ${TOWBAR_AWS_ENABLED:-false}
      TOWBAR_AWS_REGION: ${TOWBAR_AWS_REGION:-}
      TOWBAR_AWS_ACCESS_KEY_ID: ${TOWBAR_AWS_ACCESS_KEY_ID:-}
      TOWBAR_AWS_SECRET_ACCESS_KEY: ${TOWBAR_AWS_SECRET_ACCESS_KEY:-}
      TOWBAR_S3_ENABLED: ${TOWBAR_S3_ENABLED:-false}
      TOWBAR_S3_ENDPOINT: ${TOWBAR_S3_ENDPOINT:-}
      TOWBAR_S3_REGION: ${TOWBAR_S3_REGION:-}
      TOWBAR_S3_BUCKET: ${TOWBAR_S3_BUCKET:-}
      TOWBAR_S3_PREFIX: ${TOWBAR_S3_PREFIX:-}
      TOWBAR_S3_ADDRESSING_STYLE: ${TOWBAR_S3_ADDRESSING_STYLE:-}
      TOWBAR_S3_ALLOW_PRIVATE_NETWORK: ${TOWBAR_S3_ALLOW_PRIVATE_NETWORK:-false}
      TOWBAR_S3_CUSTOM_CA_BASE64: ${TOWBAR_S3_CUSTOM_CA_BASE64:-}
      TOWBAR_S3_ACCESS_KEY_ID: ${TOWBAR_S3_ACCESS_KEY_ID:-}
      TOWBAR_S3_SECRET_ACCESS_KEY: ${TOWBAR_S3_SECRET_ACCESS_KEY:-}
      TOWBAR_R2_ENABLED: ${TOWBAR_R2_ENABLED:-false}
      TOWBAR_R2_ENDPOINT: ${TOWBAR_R2_ENDPOINT:-}
      TOWBAR_R2_REGION: ${TOWBAR_R2_REGION:-}
      TOWBAR_R2_BUCKET: ${TOWBAR_R2_BUCKET:-}
      TOWBAR_R2_PREFIX: ${TOWBAR_R2_PREFIX:-}
      TOWBAR_R2_ADDRESSING_STYLE: ${TOWBAR_R2_ADDRESSING_STYLE:-}
      TOWBAR_R2_ALLOW_PRIVATE_NETWORK: ${TOWBAR_R2_ALLOW_PRIVATE_NETWORK:-false}
      TOWBAR_R2_CUSTOM_CA_BASE64: ${TOWBAR_R2_CUSTOM_CA_BASE64:-}
      TOWBAR_R2_ACCESS_KEY_ID: ${TOWBAR_R2_ACCESS_KEY_ID:-}
      TOWBAR_R2_SECRET_ACCESS_KEY: ${TOWBAR_R2_SECRET_ACCESS_KEY:-}
      TOWBAR_GCS_ENABLED: ${TOWBAR_GCS_ENABLED:-false}
      TOWBAR_GCS_PROJECT_ID: ${TOWBAR_GCS_PROJECT_ID:-}
      TOWBAR_GCS_BUCKET: ${TOWBAR_GCS_BUCKET:-}
      TOWBAR_GCS_PREFIX: ${TOWBAR_GCS_PREFIX:-}
      TOWBAR_GCS_SERVICE_ACCOUNT_JSON_BASE64: ${TOWBAR_GCS_SERVICE_ACCOUNT_JSON_BASE64:-}
      TOWBAR_INFISICAL_ENABLED: ${TOWBAR_INFISICAL_ENABLED:-false}
      TOWBAR_INFISICAL_BASE_URL: ${TOWBAR_INFISICAL_BASE_URL:-}
      TOWBAR_INFISICAL_ALLOW_PRIVATE_NETWORK: ${TOWBAR_INFISICAL_ALLOW_PRIVATE_NETWORK:-false}
      TOWBAR_INFISICAL_CLIENT_ID: ${TOWBAR_INFISICAL_CLIENT_ID:-}
      TOWBAR_INFISICAL_CLIENT_SECRET: ${TOWBAR_INFISICAL_CLIENT_SECRET:-}
      TOWBAR_DOPPLER_ENABLED: ${TOWBAR_DOPPLER_ENABLED:-false}
      TOWBAR_DOPPLER_TOKEN: ${TOWBAR_DOPPLER_TOKEN:-}
      TOWBAR_CLOUDFLARE_ENABLED: ${TOWBAR_CLOUDFLARE_ENABLED:-false}
      TOWBAR_CLOUDFLARE_ACCOUNT_ID: ${TOWBAR_CLOUDFLARE_ACCOUNT_ID:-}
      TOWBAR_CLOUDFLARE_ZONE_ID: ${TOWBAR_CLOUDFLARE_ZONE_ID:-}
      TOWBAR_CLOUDFLARE_API_TOKEN: ${TOWBAR_CLOUDFLARE_API_TOKEN:-}
      TOWBAR_CLOUDFLARE_CLOUDFLARED_IMAGE: ${TOWBAR_CLOUDFLARE_CLOUDFLARED_IMAGE:-}
      TOWBAR_NOTIFICATIONS_ENABLED: ${TOWBAR_NOTIFICATIONS_ENABLED:-false}
      TOWBAR_NOTIFICATION_CONFIG_JSON: ${TOWBAR_NOTIFICATION_CONFIG_JSON:-}
    networks: [platform]

  worker:
    image: ${TOWBAR_WORKER_IMAGE:-towbar/worker:${TOWBAR_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: apps/towbar-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      TOWBAR_INTERNAL_API_BASE_URL: http://api:4023
      TOWBAR_APP_ID: ${TOWBAR_APP_ID:-}
      TOWBAR_TRIVY_IMAGE: ${TOWBAR_TRIVY_IMAGE:-aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969}
      TOWBAR_WORKER_MAX_CONCURRENT_ACTIVITIES: ${TOWBAR_WORKER_MAX_CONCURRENT_ACTIVITIES:-4}
      WORKER_HEALTH_PORT: 4030
    networks: [platform]

  web-app:
    image: ${TOWBAR_WEB_APP_IMAGE:-towbar/web-app:${TOWBAR_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: apps/towbar-web-app/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-development}
    environment:
      TOWBAR_API_BASE_URL: ${TOWBAR_API_BASE_URL:-http://localhost:4020}
    restart: unless-stopped
    networks: [platform]

  gateway:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    profiles: [local]
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:4021/health",
        ]
      interval: 20s
      timeout: 5s
      start_period: 5s
      retries: 5
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [platform]
    ports:
      - "${TOWBAR_BIND_ADDRESS:-127.0.0.1}:${TOWBAR_PORT:-4021}:4021"
      - "${TOWBAR_BIND_ADDRESS:-127.0.0.1}:${TOWBAR_API_PORT:-4020}:4020"

  gateway-public:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    profiles: [public]
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
    environment:
      TOWBAR_GATEWAY_DOMAIN: ${TOWBAR_GATEWAY_DOMAIN:-localhost.invalid}
      TOWBAR_GATEWAY_API_DOMAIN: ${TOWBAR_GATEWAY_API_DOMAIN:-api.localhost.invalid}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 18
    volumes:
      - ./infra/gateway/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [platform]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

networks:
  platform:
    name: ${TOWBAR_NETWORK_NAME:-towbar-platform}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
