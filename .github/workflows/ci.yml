name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  # Pull request runs are grouped by branch so a newer push supersedes the
  # running check. Every other run is grouped by commit, so main pushes and
  # tags are never cancelled or replaced while pending; the release checks
  # need a result for each exact commit.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  monitoring-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: apps/towbar-monitoring-agent/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: apps/towbar-monitoring-agent
      - run: go vet ./... && go test -race ./...
        working-directory: apps/towbar-monitoring-agent
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -o /tmp/towbar-monitoring-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -o /tmp/towbar-monitoring-arm64 .
        working-directory: apps/towbar-monitoring-agent

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      # v4.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm/_npx
          key: npx-mint-4.2.851-${{ runner.os }}
      - name: Warm the Mintlify CLI
        run: npx --yes mint@4.2.851 --version
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Validate Mintlify configuration
        run: npx --yes mint@4.2.851 validate
        working-directory: docs
      - name: Check Mintlify links and redirects
        run: npx --yes mint@4.2.851 broken-links --check-anchors --check-redirects
        working-directory: docs
      - name: Audit Mintlify accessibility
        run: npx --yes mint@4.2.851 a11y
        working-directory: docs

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: python3 -m unittest discover -s infra/upgrade-runner -v
      - run: bash tools/test-host-upgrade-cli.sh
      - run: node tools/build-towbar-cli.mjs --check
      - run: node --test tools/build-towbar-cli.test.mjs
      - run: bash -n install.sh infra/towbar
      - run: shellcheck install.sh infra/towbar
      - run: |
          infra/towbar help
          infra/towbar version
      - run: shellcheck infra/postgres/*.sh infra/temporal/*.sh
      - name: Verify YAML runtime configuration migration
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-yaml
          python3 tools/check-runtime-config.py
          python3 tools/test-runtime-config.py
          bash tools/test-towbar-cli-migration.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm repository:check
      - run: pnpm repository:test
      - run: pnpm distribution:test
      - run: pnpm docs:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm docs:api:check
      - run: pnpm docs:examples:check
      - run: pnpm postman:check
      - run: pnpm typecheck
      - run: pnpm test:verification-runner
      - name: Verify embedded example
        run: |
          pnpm test:examples
          docker build --tag towbar-example:test examples
          docker run --detach --name towbar-example --publish 127.0.0.1:3000:3000 towbar-example:test
          trap 'docker logs towbar-example; docker rm --force towbar-example' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/ | grep --quiet 'Your app is running.'
      - run: pnpm audit --prod --audit-level=moderate

  # Unit tests only. Tests that need PostgreSQL, Temporal, ClickHouse or Docker
  # skip here and run once in the integration groups, which provision all of
  # them (tools/verification/run.mjs).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some suites import their own package's dist/ (for example
      # towbar-database's upgrade tests), which turbo's test task does not
      # build; the build also fills turbo's cache for the test task.
      - run: pnpm build
      - run: pnpm test
      # Same daily scanner database cache as the production job.
      - name: Date the scanner database cache
        id: trivy-cache
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # v4.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tmp/trivy-cache/db
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Verify Trivy archive permissions as a non-root Docker user
        run: |
          mkdir -p tmp/trivy-cache
          pnpm --filter towbar-worker exec tsx --test src/vulnerability-scanners/trivy.docker.test.ts
        env:
          TOWBAR_DOCKER_TESTS: "1"
          TOWBAR_TRIVY_CACHE_DIR: ${{ github.workspace }}/tmp/trivy-cache
      # The scanner helpers write as root; let the cache step read the database.
      - name: Hand the scanner database to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tmp/trivy-cache

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The image security gate keeps the scanner database between runs. The
      # key changes daily; within a day, the scanner still downloads a newer
      # database whenever the cached one is past its own next-update time.
      - name: Date the scanner database cache
        id: trivy-cache
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # v4.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tmp/trivy-cache/db
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Build, boot and verify a fresh production installation
        env:
          TOWBAR_TRIVY_CACHE_DIR: ${{ github.workspace }}/tmp/trivy-cache
        run: |
          mkdir -p tmp/trivy-cache
          node tools/verification/production.mjs
      # The scanner runs as root; let the cache step read what it wrote.
      - name: Hand the scanner database to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tmp/trivy-cache
      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-production
          path: tmp/verification/
          retention-days: 14

  integration:
    name: integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [api, docker, app, resources, scanner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same daily scanner database cache as the production job.
      - name: Date the scanner database cache
        id: trivy-cache
        if: matrix.group == 'scanner'
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # v4.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.group == 'scanner'
        with:
          path: tmp/trivy-cache/db
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Run required integration coverage without skipped suites
        env:
          TOWBAR_TRIVY_CACHE_DIR: ${{ matrix.group == 'scanner' && format('{0}/tmp/trivy-cache', github.workspace) || '' }}
        run: |
          mkdir -p tmp/trivy-cache
          pnpm verify:integration "${{ matrix.group }}"
      # The scanner helpers write as root; let the cache step read the database.
      - name: Hand the scanner database to the runner user
        if: always() && matrix.group == 'scanner'
        run: sudo chown -R "$(id -u):$(id -g)" tmp/trivy-cache
      - name: Preserve integration verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.group }}
          path: tmp/verification/
          retention-days: 14

  public-demo:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node --test tools/demo-deploy.test.mjs
      - run: shellcheck tools/test-public-demo.sh tools/deploy-public-demo.sh
      - run: docker build --target demo --tag towbar-demo:test --file apps/towbar-web-app/Dockerfile .
      - run: bash tools/test-public-demo.sh

  # The one check the main ruleset requires and Cut release reads. It needs
  # every other CI job and fails unless all of them succeeded; always() makes
  # a failed, cancelled or skipped job fail this check instead of skipping it,
  # because a skipped required check counts as passing.
  verify:
    if: always()
    needs:
      - docs
      - checks
      - tests
      - monitoring-agent
      - production
      - integration
      - public-demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(printf '%s' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These CI jobs did not pass: $failed"
            exit 1
          fi
