name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ github.token }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: test -z "$(gofmt -l .)"
        working-directory: apps/towbar-monitoring-agent
      - run: go vet ./... && go test -race ./...
        working-directory: apps/towbar-monitoring-agent
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -o /tmp/towbar-monitoring-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -o /tmp/towbar-monitoring-arm64 .
        working-directory: apps/towbar-monitoring-agent

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Validate Mintlify configuration
        run: npx --yes mint@4.2.851 validate
        working-directory: docs
      - name: Check Mintlify links and redirects
        run: npx --yes mint@4.2.851 broken-links --check-anchors --check-redirects
        working-directory: docs
      - name: Audit Mintlify accessibility
        run: npx --yes mint@4.2.851 a11y
        working-directory: docs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: towbar_secrets_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TOWBAR_TEST_DATABASE_URL: postgres://postgres:isolated-ci-password@127.0.0.1:5432/towbar_secrets_test
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@avgeek-oss"
          cache: pnpm
      - run: python3 -m unittest discover -s infra/upgrade-runner -v
      - run: bash tools/test-host-upgrade-cli.sh
      - run: node tools/build-towbar-cli.mjs --check
      - run: node --test tools/build-towbar-cli.test.mjs
      - run: bash -n install.sh infra/towbar
      - run: shellcheck install.sh infra/towbar
      - run: |
          infra/towbar help
          infra/towbar version
      - run: shellcheck infra/postgres/*.sh infra/temporal/*.sh
      - name: Verify YAML runtime configuration migration
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-yaml
          python3 tools/check-runtime-config.py
          python3 tools/test-runtime-config.py
          bash tools/test-towbar-cli-migration.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm repository:check
      - run: pnpm repository:test
      - run: pnpm distribution:test
      - run: pnpm docs:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm docs:api:check
      - run: pnpm postman:check
      - run: pnpm typecheck
      - run: pnpm test:verification-runner
      - name: Verify embedded example
        run: |
          pnpm test:examples
          docker build --tag towbar-example:test examples
          docker run --detach --name towbar-example --publish 127.0.0.1:3000:3000 towbar-example:test
          trap 'docker logs towbar-example; docker rm --force towbar-example' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/ | grep --quiet 'Your app is running.'
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=moderate
      - name: Verify Trivy archive permissions as a non-root Docker user
        run: pnpm --filter towbar-worker exec tsx --test src/vulnerability-scanners/trivy.docker.test.ts
        env:
          TOWBAR_DOCKER_TESTS: "1"
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@avgeek-oss"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, boot and verify a fresh production installation
        run: node tools/verification/production.mjs
      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-production
          path: tmp/verification/
          retention-days: 14

  integration:
    name: integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [api, docker, app, resources, scanner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@avgeek-oss"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run required integration coverage without skipped suites
        run: pnpm verify:integration "${{ matrix.group }}"
      - name: Preserve integration verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ matrix.group }}
          path: tmp/verification/
          retention-days: 14

  public-demo:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: node --test tools/demo-deploy.test.mjs
      - run: shellcheck tools/test-public-demo.sh tools/deploy-public-demo.sh
      - run: docker build --secret id=NODE_AUTH_TOKEN,env=NODE_AUTH_TOKEN --target demo --tag towbar-demo:test --file apps/towbar-web-app/Dockerfile .
      - run: bash tools/test-public-demo.sh

  required-ci:
    name: Required CI
    if: always()
    needs: [docs, verify, monitoring-agent, compose, integration, public-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(jobs)) { if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode = 1; } }'
