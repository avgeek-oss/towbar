version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Better Auth 1.7 plugins require the 0.4 utilities peer dependency.
      - dependency-name: "@better-auth/utils"
        versions: [">=0.5.0"]
  - package-ecosystem: docker
    directories:
      - /apps/towbar-api
      - /apps/towbar-worker
      - /apps/towbar-web-app
      - /examples
      - /examples/persistent-files
      - /examples/platform-modes/node-app
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directories:
      - /
      - /infra/demo
      - /examples/platform-modes/compose
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # A major version of PostgreSQL, Temporal, Caddy or Redis needs a
      # planned migration, not a routine bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /apps/towbar-monitoring-agent
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
